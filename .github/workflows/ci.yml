name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax-check JS
        run: |
          set -e
          for f in newtab.js background.js popup.js suspended.js emoji-data.js prepaint.js import-utils.js scripts/quality-gates.js scripts/onboarding-contract-test.js scripts/item-detail-contract-test.js scripts/popup-locate-contract-test.js scripts/popup-page-contract-test.js scripts/trash-recovery-contract-test.js scripts/organization-removal-contract-test.js scripts/organization-delete-contract-test.js scripts/organization-naming-contract-test.js scripts/organization-creation-contract-test.js scripts/organization-move-contract-test.js scripts/group-stack-identity-contract-test.js scripts/import-recovery-test.js scripts/archive-scale-contract-test.js scripts/export-import-scale-contract-test.js scripts/background-contract-test.js scripts/reminder-identity-contract-test.js scripts/reminder-overdue-contract-test.js scripts/reminder-timezone-contract-test.js scripts/undo-contract-test.js scripts/concurrency-contract-test.js scripts/state-sync-contract-test.js scripts/state-storage-order-contract-test.js plan-contract.js planner.js companion/mcp-server.js companion/native-host.js companion/locus-planner.js companion/lib/store.js companion/lib/native-framing.js companion/lib/runners.js scripts/plan-contract-test.js scripts/plan-companion-contract-test.js scripts/calendar-planner-contract-test.js scripts/today-contract-test.js plan.js scripts/plan-page-contract-test.js scripts/notifications-contract-test.js scripts/canvas-pages-contract-test.js scripts/inbox-page-contract-test.js scripts/library-page-contract-test.js scripts/space-page-contract-test.js scripts/search-page-contract-test.js scripts/core-visual-system-contract-test.js scripts/general-settings-contract-test.js scripts/appearance-settings-contract-test.js scripts/privacy-settings-contract-test.js scripts/plugins-hub-contract-test.js scripts/saved-page-reopen-contract-test.js scripts/search-recovery-contract-test.js scripts/library-recovery-contract-test.js scripts/organization-terminology-contract-test.js scripts/paste-links-contract-test.js scripts/selection-docket-contract-test.js scripts/calendar-add-task-contract-test.js; do
            echo "node --check $f"
            node --check "$f"
          done
      - name: Validate JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8'))"
      - name: Validate manifest fields
        run: |
          node -e "
            const m = JSON.parse(require('fs').readFileSync('manifest.json','utf8'));
            if (m.manifest_version !== 3) throw new Error('manifest_version must be 3');
            for (const k of ['name','version','permissions','background','action']) {
              if (!(k in m)) throw new Error('missing field: ' + k);
            }
            if (!m.background.service_worker) throw new Error('background.service_worker missing');
            if (!Array.isArray(m.permissions)) throw new Error('permissions must be an array');
          "
      - name: Enforce extension quality gates
        run: node scripts/quality-gates.js
      - name: Test first-use onboarding contracts
        run: node scripts/onboarding-contract-test.js
      - name: Test saved-item detail contracts
        run: node scripts/item-detail-contract-test.js
      - name: Test popup Locate contracts
        run: node scripts/popup-locate-contract-test.js
      - name: Test toolbar popup page contracts
        run: node scripts/popup-page-contract-test.js
      - name: Test destructive recovery contracts
        run: node scripts/trash-recovery-contract-test.js
      - name: Test organization removal contracts
        run: node scripts/organization-removal-contract-test.js
      - name: Test empty-only organization deletion contracts
        run: node scripts/organization-delete-contract-test.js
      - name: Test organization naming contracts
        run: node scripts/organization-naming-contract-test.js
      - name: Test organization creation contracts
        run: node scripts/organization-creation-contract-test.js
      - name: Test existing-Space Group move contracts
        run: node scripts/organization-move-contract-test.js
      - name: Test Group and Stack identity contracts
        run: node scripts/group-stack-identity-contract-test.js
      - name: Test import recovery fixtures
        run: node scripts/import-recovery-test.js
      - name: Test archive scale contracts
        run: node scripts/archive-scale-contract-test.js
      - name: Test export/import scale contracts
        run: node scripts/export-import-scale-contract-test.js
      - name: Test background contracts
        run: node scripts/background-contract-test.js
      - name: Test reminder identity contracts
        run: node scripts/reminder-identity-contract-test.js
      - name: Test reminder overdue contracts
        run: node scripts/reminder-overdue-contract-test.js
      - name: Test reminder timezone contracts
        run: node scripts/reminder-timezone-contract-test.js
      - name: Test Undo contracts
        run: node scripts/undo-contract-test.js
      - name: Test new-tab state freshness contracts
        run: node scripts/state-sync-contract-test.js
      - name: Test serialized state-write concurrency
        run: node scripts/concurrency-contract-test.js
      - name: Test storage key-order echo contracts
        run: node scripts/state-storage-order-contract-test.js
      - name: Test AI plan contract (dates, DST, conflicts, prompts)
        run: node scripts/plan-contract-test.js
      - name: Test planner companion transport (MCP, native host, queue)
        run: node scripts/plan-companion-contract-test.js
      - name: Test Calendar planner apply contracts
        run: node scripts/calendar-planner-contract-test.js
      - name: Test Today board contracts (model, capture parsing, transactions)
        run: node scripts/today-contract-test.js
      - name: Test Plan page contracts
        run: node scripts/plan-page-contract-test.js
      - name: Test notification contracts
        run: node scripts/notifications-contract-test.js
      - name: Test canvas page contracts
        run: node scripts/canvas-pages-contract-test.js
      - name: Test Inbox page contracts
        run: node scripts/inbox-page-contract-test.js
      - name: Test Library page contracts
        run: node scripts/library-page-contract-test.js
      - name: Test Space page contracts
        run: node scripts/space-page-contract-test.js
      - name: Test Find again and command palette page contracts
        run: node scripts/search-page-contract-test.js
      - name: Test core visual system contracts
        run: node scripts/core-visual-system-contract-test.js
      - name: Test general settings contracts
        run: node scripts/general-settings-contract-test.js
      - name: Test appearance settings contracts
        run: node scripts/appearance-settings-contract-test.js
      - name: Test privacy settings contracts
        run: node scripts/privacy-settings-contract-test.js
      - name: Test Plugins hub contracts
        run: node scripts/plugins-hub-contract-test.js
      - name: Test saved-page Reopen safety contracts
        run: node scripts/saved-page-reopen-contract-test.js
      - name: Test Search recovery contracts
        run: node scripts/search-recovery-contract-test.js
      - name: Test Library recovery ledger contracts
        run: node scripts/library-recovery-contract-test.js
      - name: Test organization terminology contracts
        run: node scripts/organization-terminology-contract-test.js
      - name: Test Paste links contracts
        run: node scripts/paste-links-contract-test.js
      - name: Test selection docket contracts
        run: node scripts/selection-docket-contract-test.js
      - name: Test Calendar Add-task contracts
        run: node scripts/calendar-add-task-contract-test.js
